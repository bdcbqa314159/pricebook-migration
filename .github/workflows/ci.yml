name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # numpy/scipy pinned: S17 adopted scipy for L0 numerics; a version bump can shift
      # convergence, so the version is part of the reproducibility contract (CLAUDE.md).
      - run: pip install pytest ruff hypothesis numpy==2.4.3 scipy==1.17.1
      - run: python verify.py acyclic
      - run: python verify.py layers      # semantic layer gate (L0 finance-free)
      - run: python verify.py debt
      # The quarry must stay IMPORTABLE: walks the tree, floors the module count (CLAUDE.md §4
      # park-model clause + §6 floor rule). NOT `import pricebook` — that proxy passed while 265
      # of 583 modules were broken. Ruling: docs/handoffs/rulings_quarry_park_model.md.
      - run: python verify.py quarry
      - run: python verify.py version
      - run: python verify.py provenance
      # Signature discipline (CLAUDE.md 3b): PLR0913 max-args=5 via ruff (docs/09).
      - run: ruff check src/pricebook
      # Static-type gate: pyright over src/pricebook (config: pyrightconfig.json). Pinned like
      # numpy/scipy — a pyright bump can surface new diagnostics, so the version is part of the
      # reproducibility contract. Node is preinstalled on ubuntu + windows runners.
      - run: npx -y pyright@1.1.411
      # Every layer dir present, by discovery — no --layer ceiling to remember — AND the
      # collected count is held to verify.py's committed TEST_FLOOR, RED below it (the floor
      # rule, CLAUDE.md §6; ruling docs/handoffs/rulings_floor_rule.md). The old `--layer 0`
      # gated 177 of 366 tests for six slices. A slice that adds a tier raises TEST_FLOOR in
      # the same commit; green over a truncated collection is not green.
      - run: python verify.py tests
